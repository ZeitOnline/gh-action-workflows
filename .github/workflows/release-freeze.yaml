name: Release freeze
on:
  workflow_call:
    inputs:
      label:
        description: "Label that freezes merging while any open pull request carries it"
        required: false
        type: string
        default: freeze
      branch:
        description: "Base branch whose pull requests get the status"
        required: false
        type: string
        default: main
jobs:
  freeze:
    name: Release freeze
    runs-on: zon-ubuntu-general-dind
    permissions:
      statuses: write
      pull-requests: read
    # pull requests that only changed their description don't need a run
    if: github.event.action != 'edited' || github.event.changes.base
    # every run sets the status on all open pull requests, so the latest one wins
    concurrency:
      group: release-freeze-${{ github.repository }}
      cancel-in-progress: true
    steps:
      - name: Set the `release-freeze` status on every open pull request
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          LABEL: ${{ inputs.label }}
          BRANCH: ${{ inputs.branch }}
        run: |
          # labels and head commits need only `pull-requests: read`; the
          # current status is read per commit below (GraphQL would need
          # `contents: read` and `checks: read` for it)
          prs=$(gh pr list --state open --base "$BRANCH" --limit 500 \
              --json number,headRefName,headRefOid,labels \
              --jq '.[] | [
                  .number, .headRefName, .headRefOid,
                  (any(.labels[]; .name == $ENV.LABEL) | tostring)
                ] | @tsv')
          if awk -F '\t' '$4 == "true" { found = 1 } END { exit !found }' <<< "$prs"; then
            state=pending description="Release freeze, merging is blocked"
          else
            state=success description="No release freeze"
          fi
          echo "$description"
          [ -n "$prs" ] || exit 0
          while IFS=$'\t' read -r number ref sha _; do
            s=$state d=$description
            case "$ref" in  # the release itself has to stay mergeable
              release-please--*) s=success d="Release pull request, exempt from the freeze" ;;
            esac
            # GitHub keeps at most 1000 statuses per commit, so only set changes
            current=$(gh api "repos/$GH_REPO/commits/$sha/statuses" \
                --jq '[.[] | select(.context == "release-freeze")][0].state // "none"')
            if [ "$current" = "$s" ]; then
              echo "#$number: $s (unchanged)"
              continue
            fi
            echo "#$number: $s"
            gh api "repos/$GH_REPO/statuses/$sha" --silent \
                -f state="$s" -f context=release-freeze -f description="$d"
          done <<< "$prs"
