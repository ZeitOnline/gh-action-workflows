name: Release freeze
on:
  workflow_call:
    inputs:
      label:
        description: "Label that freezes merging while any open pull request carries it"
        required: false
        type: string
        default: freeze
      branch:
        description: "Base branch whose pull requests get the status"
        required: false
        type: string
        default: main
jobs:
  freeze:
    name: Release freeze
    runs-on: zon-ubuntu-general-dind
    permissions:
      statuses: write
      pull-requests: read
    # every run sets the status on all open pull requests, so the latest one wins
    concurrency:
      group: release-freeze-${{ github.repository }}
      cancel-in-progress: true
    steps:
      - name: Set the `release-freeze` status on every open pull request
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          LABEL: ${{ inputs.label }}
          BRANCH: ${{ inputs.branch }}
        run: |
          frozen=$(gh pr list --state open --label "$LABEL" --json number --jq length)
          if [ "$frozen" -gt 0 ]; then
            state=failure description="Release freeze, merging is blocked"
          else
            state=success description="No release freeze"
          fi
          echo "$description"
          gh pr list --state open --base "$BRANCH" --limit 500 \
              --json number,headRefName,headRefOid \
              --jq '.[] | "\(.number) \(.headRefName) \(.headRefOid)"' |
          while read -r number ref sha; do
            s=$state d=$description
            case "$ref" in  # the release itself has to stay mergeable
              release-please--*) s=success d="Release pull request, exempt from the freeze" ;;
            esac
            echo "#$number: $s"
            gh api "repos/$GH_REPO/statuses/$sha" --silent \
                -f state="$s" -f context=release-freeze -f description="$d"
          done
