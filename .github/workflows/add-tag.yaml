name: Add tag to images
on:
  workflow_call:
    inputs:
      project:
        required: false
        type: string
      tag:
        required: true
        type: string
      versions:
        required: false
        type: string
        default: k8s/staging/versions/kustomization.yaml
jobs:
  add-tag:
    name: Add tag to docker images
    runs-on: zon-ubuntu-general-dind
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: true
      - name: Set variables
        run: |
          input="${{ inputs.project }}"
          repository="${{ github.repository }}"
          default="${repository##*/}"
          project="${input:-$default}"
          echo "project=$project" >> "$GITHUB_ENV"
          echo "prefix=${{ vars.GAR_DOCKER_REGISTRY }}/$project" >> "$GITHUB_ENV"
      # make sure the images contain all changes up to the release commit
      - name: Check image versions
        run: |
          versions="${{ inputs.versions }}"
          newest="" distance=""
          for tag in $(awk '/newTag:/ { print $2 }' "$versions" | sort -u); do
            sha=$(git rev-parse -q --verify "$tag^{commit}") || continue
            count=$(git rev-list --count "$sha..HEAD")
            if [ -z "$newest" ] || [ "$count" -lt "$distance" ]; then
              newest="$sha" distance="$count"
            fi
          done
          if [ -z "$newest" ]; then
            echo "::error::None of the image tags in '$versions' matches a commit."
            exit 1
          fi
          changes=$(git diff --name-only "$newest" HEAD^ -- . ":(exclude)$(dirname "$versions")")
          if [ -n "$changes" ]; then
            echo "::error::Images were built from $(git rev-parse --short "$newest") and lack later changes (was the release merged before the 'staging' build finished?), please create a new release."
            echo "$changes"
            exit 1
          fi
      - name: Setup auth
        uses: ZeitOnline/gh-action-baseproject@v0
        with:
          project_name: ${{ env.project }}
          environment: production     # needs 'production' service account
          gar_docker_auth: true
      - name: Add tag
        run: |
          awk '
            /- name:/ { image = ENVIRON["prefix"] "-" $3 }
            /newTag:/ { print "gcloud artifacts docker tags add", image ":" $2, image ":${{ inputs.tag }}" }
          ' ${{ inputs.versions }} | bash
